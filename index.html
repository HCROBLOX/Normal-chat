<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💬 Chat 1:1 Thời Gian Thực</title>
  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{max-width:550px;margin:15px auto;padding:0 10px;background:#f0f2f5}
    .box{background:white;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    #khungTin{height:320px;overflow-y:auto;border:1px solid #ddd;border-radius:6px;padding:8px;margin-bottom:8px;background:#fafafa}
    .tin{margin:4px 0;padding:6px 10px;border-radius:16px;max-width:80%}
    .ban{background:#007bff;color:white;margin-left:auto}
    .khac{background:#e9ecef;color:black;margin-right:auto}
    .hang{display:flex;gap:6px;align-items:center}
    input{flex:1;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
    button{padding:8px 14px;background:#007bff;color:white;border:none;border-radius:6px;cursor:pointer}
    button:disabled{background:#ccc;cursor:not-allowed}
    .trangthai{font-size:13px;color:#666;margin-bottom:6px}
    #linkKq,#idKq{margin-top:6px;font-size:13px;word-break:break-all}
  </style>
  <!-- THƯ VIỆN MIỄN PHÍ, KHÔNG CẦN KEY -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<h2 style="text-align:center;margin-bottom:15px">💬 Chat 1:1 Qua Link/ID</h2>

<div class="box">
  <div class="trangthai" id="trangthai">Đang kết nối...</div>
  <div id="idKq"></div>
  <div id="linkKq"></div>
  <div class="hang" style="margin-bottom:8px">
    <input id="nhapId" placeholder="Nhập ID người kia..." style="flex:0.6">
    <button id="btnKetNoi">Kết nối</button>
  </div>
  <div id="khungTin"></div>
  <div class="hang">
    <input id="nhapTin" placeholder="Nhập tin nhắn..." disabled>
    <button id="btnGui" disabled>Gửi</button>
  </div>
</div>

<script>
const trangthai = document.getElementById('trangthai');
const idKq = document.getElementById('idKq');
const linkKq = document.getElementById('linkKq');
const nhapId = document.getElementById('nhapId');
const btnKetNoi = document.getElementById('btnKetNoi');
const khungTin = document.getElementById('khungTin');
const nhapTin = document.getElementById('nhapTin');
const btnGui = document.getElementById('btnGui');

let peer, kn;
const maPhong = new URLSearchParams(location.search).get('p') || Math.random().toString(36).slice(2,10);
history.replaceState({},'',`?p=${maPhong}`);

// TẠO KẾT NỐI
peer = new Peer(maPhong);
peer.on('open', id => {
  trangthai.textContent = `✅ Sẵn sàng - ID của bạn: ${id}`;
  idKq.innerHTML = `📋 ID: <input value="${id}" readonly style="width:100%;padding:4px;margin-top:4px">`;
  linkKq.innerHTML = `🔗 Link mời: <br><input value="${location.href}" readonly style="width:100%;padding:4px;margin-top:4px">`;
  // Tự kết nối nếu mở link có mã phòng
  if(location.search.includes('p=') && !location.search.includes(`p=${id}`)){
    ketNoiDen(maPhong);
  }
});
peer.on('connection', xuLyKetNoi);
peer.on('error', e => trangthai.textContent = `❌ Lỗi: ${e.type}`);

// NÚT KẾT NỐI
btnKetNoi.onclick = () => nhapId.value.trim() && ketNoiDen(nhapId.value.trim());
window.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(!kn && nhapId.value.trim()) btnKetNoi.click();
    else if(kn && nhapTin.value.trim()) btnGui.click();
  }
});

function ketNoiDen(doiTuong){
  trangthai.textContent = `⏳ Đang kết nối đến ${doiTuong}...`;
  xuLyKetNoi(peer.connect(doiTuong));
}

function xuLyKetNoi(ketNoiMoi){
  kn = ketNoiMoi;
  kn.on('open', ()=>{
    trangthai.textContent = '✅ ĐÃ KẾT NỐI – Bắt đầu nhắn tin';
    nhapTin.disabled = btnGui.disabled = false;
  });
  kn.on('data', nd => themTin('khac', nd));
  kn.on('close', ()=>{
    trangthai.textContent = '🔌 Đã ngắt kết nối';
    nhapTin.disabled = btnGui.disabled = true;
    kn = null;
  });
  kn.on('error', e => trangthai.textContent = `❌ Lỗi kết nối: ${e}`);
}

// GỬI & HIỂN THỊ TIN
btnGui.onclick = ()=>{
  const nd = nhapTin.value.trim();
  if(!nd || !kn) return;
  kn.send(nd);
  themTin('ban', nd);
  nhapTin.value = '';
};

function themTin(loai, nd){
  const div = document.createElement('div');
  div.className = `tin ${loai}`;
  div.textContent = nd;
  khungTin.appendChild(div);
  khungTin.scrollTop = khungTin.scrollHeight;
}
</script>
</body>
  </html>
